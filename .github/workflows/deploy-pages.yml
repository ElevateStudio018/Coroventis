name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/higgsfield-setup-qfmg3l"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This runner has ordinary internet access, unlike the sandbox this
      # site was built in — so this is where the Higgsfield hero clip
      # actually gets downloaded and self-hosted, instead of hotlinking to
      # Higgsfield's CDN (see references/scroll-scrub.md for the encode spec).
      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi

      - name: Fetch and encode hero clip
        run: |
          set -euo pipefail
          mkdir -p assets/hero
          SRC="https://d8j0ntlcm91z4.cloudfront.net/user_3JMRCS5Gqr1i91oYJAjDfAzmWyZ/hf_20260918_001745_9a7051e8-0058-431d-9b1e-bc75ff783a33.mp4"
          if [ ! -f assets/hero/hero-desktop.mp4 ]; then
            curl -fL --retry 3 -o /tmp/hero-source.mp4 "$SRC"
            ffmpeg -v error -y -i /tmp/hero-source.mp4 -an \
              -vf "unsharp=5:5:0.8:5:5:0.0" \
              -c:v libx264 -preset slow -crf 20 -pix_fmt yuv420p \
              -g 8 -keyint_min 8 -sc_threshold 0 -movflags +faststart \
              assets/hero/hero-desktop.mp4
            ffmpeg -v error -y -i /tmp/hero-source.mp4 -an \
              -vf "scale=-2:'min(720,ih)',unsharp=5:5:0.6:5:5:0.0" \
              -c:v libx264 -preset slow -crf 23 -pix_fmt yuv420p \
              -g 4 -keyint_min 4 -sc_threshold 0 -movflags +faststart \
              assets/hero/hero-mobile.mp4
            ffmpeg -v error -y -ss 0 -i assets/hero/hero-desktop.mp4 \
              -frames:v 1 -q:v 2 assets/hero/hero-poster.jpg
            ffmpeg -v error -y -ss 0 -i assets/hero/hero-mobile.mp4 \
              -frames:v 1 -q:v 2 assets/hero/hero-poster-mobile.jpg
          fi

      - name: Commit self-hosted assets
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain assets/hero)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add assets/hero
            git commit -m "Self-host encoded hero clip (automated)"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
